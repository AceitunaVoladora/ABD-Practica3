# Definición de los modelos del ODM.
#
# Por cada modelo se declara:
#   required_vars    atributos que TIENEN que estar en cada documento
#   admissible_vars  atributos válidos que no tienen por qué estar
#   unique_indexes   índices con restricción de unicidad
#   regular_indexes  índices ascendentes normales
#   location_index   campo de dirección del que se derivará el punto GeoJSON
#
# Ojo con location_index: se declara el campo BASE de la dirección. El punto
# GeoJSON se guardará en <campo>_loc, y es sobre ese campo sobre el que hay
# que crear el índice 2dsphere.
#
# Este fichero es un EJEMPLO con un solo modelo. Hay que sustituirlo por los
# cuatro modelos de EnVivo: recinto, artista, evento y asistente.

recinto:
  required_vars:
    - nombre
    - direccion
    - aforo
    - ciudad
  admissible_vars:
    - zonas
    - servicios
    - direccion_loc
  unique_indexes:
    - nombre
  regular_indexes:
    - aforo
  location_index: direccion

artista:
  required_vars:
    - nombre
    - generos
  admissible_vars: 
    - pais
    - anio_inicio
  unique_indexes:
    - nombre

evento:
  required_vars:
    - titulo
    - artistas
    - recinto
    - fecha
  admissible_vars:
    - precios_por_zona
    - entradas_vendidas
    - estado
  regular_indexes:
    - recinto
    - fecha

asistente:
  required_vars:
    - nombre
    - email
    - fecha_alta
    - direccion
  admissible_vars:
    - preferencias
    - direccion_loc
  unique_indexes:
    - email
  location_index: direccion
